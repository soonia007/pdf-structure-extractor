name: Build desktop app

# Runs when app code changes on main or a feature branch, manually
# (Actions tab → "Build desktop app" → Run workflow), or on a tag like
# v0.2.0, which also publishes a GitHub Release with the files.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pdfstruct-windows
          - os: macos-latest
            artifact: pdfstruct-macos
          - os: ubuntu-latest
            artifact: pdfstruct-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[build]"
      - name: Build
        run: python packaging/build.py
      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/pdfstruct.app/Contents/MacOS/pdfstruct --version
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/pdfstruct/pdfstruct.exe --version
          else
            ./dist/pdfstruct/pdfstruct --version
          fi
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent pdfstruct.app ../${{ matrix.artifact }}.zip
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.artifact }}.zip pdfstruct
          else
            tar czf ../${{ matrix.artifact }}.tar.gz pdfstruct
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.*
